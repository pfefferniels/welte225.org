<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WM 225</title>
  <link rel="alternate" type="application/ld+json" href="/edition.jsonld" title="Roll edition of WM 225 as JSON-LD">
  <script>
    // An entity IRI of the edition opens the edition at that entity in
    // Roll Desk. Anything else is a page that does not exist.
    (function () {
      var path = location.pathname.replace(/^\//, '')
      var uuid = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
      var apps = [
        { entity: new RegExp('^(symbol_|copy/)?' + uuid + '$', 'i'), at: 'https://rolldesk.welte225.org/' }
      ]
      for (var i = 0; i < apps.length; i++) {
        if (apps[i].entity.test(path)) {
          location.replace(apps[i].at + path + location.search + location.hash)
          return
        }
      }
    })()
  </script>
  <style>
    :root { color-scheme: light; --ground: #ffffff; --ink: #16181d; --muted: #5b6270; --link: #1f4e8c; }
    body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.55; }
    main { max-width: 720px; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 2rem; margin: 0 0 0.6rem; }
    p { margin: 0.6rem 0; color: var(--muted); max-width: 60ch; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Nothing is published at this address.</h1>
    <p>Identifiers of the edition of WM 225 open in Roll Desk; this one is not among them.</p>
    <p><a href="/">To the roll</a> · <a href="/edition.jsonld">the edition as JSON-LD</a></p>
  </main>
</body>
</html>
