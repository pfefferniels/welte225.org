# Checks /hummed/ whenever it, or the reconstruction it hums along to, changes: types, lint,
# formatting, tests (the voice's fingerprint among them), and that the committed bundles, which
# GitHub Pages serves as they are, are what the sources build to.

name: Check the hummed page

on:
  push:
    branches: [main]
    paths: ['hummed/**', 'take/**', 'mpm/**', '.github/workflows/hummed.yml']
  pull_request:
    paths: ['hummed/**', 'take/**', 'mpm/**', '.github/workflows/hummed.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hummed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hummed/package-lock.json

      - run: npm ci
      - run: npm run check

      - name: The committed bundles are what the sources build to
        run: |
          npm run build
          git diff --exit-code -- app.js app.js.map worker.js worker.js.map take.js take.js.map take-worker.js take-worker.js.map
